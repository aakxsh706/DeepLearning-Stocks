name: neurostock

x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
  environment: &backend-env
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-neurostock}:${POSTGRES_PASSWORD:-neurostock-local}@db:5432/${POSTGRES_DB:-neurostock}
    ARTIFACT_DIR: /app/runtime/models
    CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    ALPHA_VANTAGE_API_KEY: ${ALPHA_VANTAGE_API_KEY:-}
    WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-1}
    TRAINING_STALE_SECONDS: ${TRAINING_STALE_SECONDS:-900}
    EVENT_RETENTION: ${EVENT_RETENTION:-2000}
  volumes:
    - model-data:/app/runtime
  init: true
  restart: unless-stopped

services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-neurostock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-neurostock-local}
      POSTGRES_DB: ${POSTGRES_DB:-neurostock}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *backend
    command: ["alembic", "-c", "backend/alembic.ini", "upgrade", "head"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  worker:
    <<: *backend
    command: ["python", "-m", "app.worker"]
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: deploy/frontend.Dockerfile
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  model-data:
